trigger:
  branches:
    include:
      - main
      - develop
pr:
  branches:
    include:
      - main
      - develop

parameters:
- name: runE2ETests
  displayName: Run E2E tests
  type: boolean
  default: false

pool:
  vmImage: 'windows-latest'

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    displayName: Build & Test
    steps:
    - template: build-template.yml
      parameters:
        solution: '**/*.sln'
        configuration: 'Release'
        runE2ETests: ${{ parameters.runE2ETests }}
