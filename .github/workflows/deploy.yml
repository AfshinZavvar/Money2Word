name: Deploy to Azure App Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Require main branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main deployment
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deployments must run from main."
          exit 1

  build-test:
    name: Build, test, and package
    needs: validate-ref
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  deploy:
    name: Deploy production
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: money2word-package
          path: artifacts

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy application
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: Money2Word
          package: artifacts/Money2Word.zip
