services:
  money2word:
    ports:
      # In development, bind host port 5000 to the container's 8080.
      # The base compose file's "8080:8080" mapping is replaced here.
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      # Mount the development settings file as read-only so local
      # overrides (verbose logging, etc.) are visible inside the container
      # without having to rebuild the image.
      - ./Money2Word/appsettings.Development.json:/app/appsettings.Development.json:ro
