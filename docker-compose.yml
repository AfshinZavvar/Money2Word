services:
  money2word:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: money2word:latest
    ports:
      - "${MONEY2WORD_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApplicationInsights__ConnectionString: "${ApplicationInsights__ConnectionString:-}"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
