services:
  money2word:
    build:
      context: .
      dockerfile: Dockerfile
    image: money2word:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Provide the real value via a .env file or a container secret.
      # See .env.example for the expected format.
      ApplicationInsights__ConnectionString: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
